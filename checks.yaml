# Налаштування засобу check для спільного проєкту (шаблон – web/joint/checks-template.yaml).
# Ядро перевіряється завжди; в items – лише виконані пункти поза ядром.
web:
  openapi: web/openapi.yaml
  base: http://localhost:8080
  items:
    - О1.6   # система, /health, X-Request-ID, журнал JSON
    - О2.3   # повтор після втраченої відповіді (after_commit_before_response)
    - О2.4   # повторні спроби в клієнті
    - Д2.4   # продовження з If-Match (PATCH /v1/rentals/{id}, x-course: update)
    - Д2.5   # повторне скасування (POST /v1/rentals/{id}/cancel, x-course: cancel)
    - О3.3   # CORS для походження клієнта, Origin / Sec-Fetch-Site для змінювальних запитів
    - О3.4   # вхід, вихід, чужий об'єкт, функція персоналу в клієнті
    - Д3.3   # обмеження спроб входу (LOGIN_MAX_FAILURES за LOGIN_WINDOW_MIN хв)
  # ЛР3: вхід – сесія в cookie session; шлях функції персоналу з конкретним авто демоданих
  roles:
    staff-action: {method: POST, path: /v1/cars/car-pod-003/service}
  role_names:
    user: user
    staff: staff
  instances:
    app-a: "http://localhost:8001"
    app-b: "http://localhost:8002"
  services:
    nginx: nginx
    app-a: app-a
    app-b: app-b
    postgres: postgres
  log_fields:
    time: time
    instance: instance
    route: route
    status: status
    duration: duration_ms

dpc:
  openapi: dpc/openapi.yaml
  base: http://localhost:8000
  items:
    - О2.2   # дослідження точності
    - Д2.1   # інший метод (Сімпсон, трапеції) і порівняння
    - Д2.4   # послідовне, попарне й компенсоване сумування
    - О3.2   # IN_FLIGHT_LIMIT незавершених задач Ray
    - Д3.3   # Idempotency-Key для POST /v1/rental-starts
  services:
    api: api
    ray-head: ray-head
    ray-worker: ray-worker
  load_s: 10
  resource:
    path: /v1/zone-cars/loadtest
    ok_field: invariant_ok
  metrics:
    - queue_length
    - in_flight
    - rejected
  # ЛР2: відносний допуск, n для прискорення, режими спільної суми (параметр тіла mode)
  compute:
    tolerance: 1.0e-6
    bench_n: 20000000
    modes:
      param: mode
      values:
        - none
        - lock
        - local

# Наскрізний сценарій з'явиться з ЛР4 Web (розблокування передає команду старту оренди в DPC).
scenario: []
