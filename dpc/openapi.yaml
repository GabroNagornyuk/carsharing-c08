# Контракт сервісу api частини DPC, C08 «Каршеринг». Маршрути додаються з кожною ЛР; зараз – ЛР1–ЛР3.
# x-course для засобу check: receiver, request-state, resource-state. "{uuid}" – новий id у кожному запиті.
openapi: 3.1.0
info:
  title: Каршеринг – платформа оренд (DPC)
  version: 1.0.0
  description: |
    Сервіс приймає команди старту оренди в обмежену чергу. З ЛР3 (EXECUTION=ray) команду виконує
    задача Ray: вона перевіряє посвідчення водія (повільний виклик 300–900 мс) і доставляє результат
    приймачу `POST /v1/rental-start-effects`, який змінює ресурс зони `zone_cars`, зберігаючи
    інваріант «орендованих авто зони не більше, ніж є». Незавершених задач – не більше IN_FLIGHT_LIMIT. Маршрути `/v1` потребують
    `Authorization: Bearer <API_TOKEN>`. Помилки – Problem Details (RFC 9457).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8000
security:
  - apiToken: []

tags:
  - name: service
    description: Службові маршрути
  - name: rental-starts
    description: Команди старту оренди та ресурс зони
  - name: compute
    description: Розрахунок ЛР2 – машино-години оренди
  - name: effects
    description: Приймач результатів задач Ray (ЛР3)

paths:
  /health:
    get:
      tags:
        - service
      operationId: getHealth
      summary: Перевірка працездатності процесу; швидка відповідь навіть за повної черги
      security: []
      responses:
        "200":
          description: Процес відповідає
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  instance:
                    type: string
  /metrics:
    get:
      tags:
        - service
      operationId: getMetrics
      summary: Перцентилі часу відповіді HTTP, запити в обробці, довжина черги, відмови
      security: []
      responses:
        "200":
          description: Метрики
          content:
            application/json:
              schema:
                type: object
                properties:
                  latency_ms:
                    type: object
                    description: Час відповіді HTTP маршрутів /v1 (останні 2000 запитів), не час виконання команди
                    properties:
                      p50:
                        type:
                          - number
                          - "null"
                      p95:
                        type:
                          - number
                          - "null"
                      p99:
                        type:
                          - number
                          - "null"
                  in_flight:
                    type: integer
                  queue_length:
                    type: integer
                  queue_capacity:
                    type: integer
                  workers:
                    type: integer
                  processing:
                    type: integer
                  rejected:
                    type: integer
                    description: 429 через повну чергу + відхилення за предметним правилом
                  rejected_queue_full:
                    type: integer
                  tasks_in_flight:
                    type: integer
                    description: ЛР3 – незавершені задачі Ray зараз (не більше tasks_in_flight_limit)
                  tasks_in_flight_limit:
                    type: integer
                    description: IN_FLIGHT_LIMIT у режимі ray, 0 у режимі local
                  tasks_max_in_flight:
                    type: integer
                  tasks_submitted:
                    type: integer
                  responses:
                    type: object
  /metrics/prom:
    get:
      tags:
        - service
      operationId: getMetricsPrometheus
      summary: Ті самі метрики у форматі Prometheus
      security: []
      responses:
        "200":
          description: Метрики
          content:
            text/plain:
              schema:
                type: string

  /v1/rental-starts:
    post:
      tags:
        - rental-starts
      operationId: createRentalStart
      summary: Прийняти команду старту оренди в обмежену чергу (202) або 429, якщо черга повна
      description: |
        Повтор з тим самим `command_id` і тими самими полями повертає поточний стан (200) без
        другого запису; той самий `command_id` з іншими полями – 409.

        Д3.3: необов'язковий `Idempotency-Key`. Повтор з тим самим ключем і тілом повертає ту саму
        команду (200, `Idempotent-Replayed: true`); з іншим тілом – 409 `idempotency-key-reused`;
        одночасні дублікати – одне приймання.
      x-course: receiver
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 8
            maxLength: 128
          example: k-6f1c2a9e-4b7d-4c1e-9a55-2d3f8b0e7c11
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RentalStartCreate"
            examples:
              normal:
                summary: Старт оренди в зоні навантажувальної перевірки
                value:
                  command_id: "r-{uuid}"
                  car_id: car-lt-1
                  driver_id: u-driver-1
                  zone: loadtest
              airport:
                summary: Старт оренди в зоні аеропорту (10 авто)
                value:
                  command_id: "r-{uuid}"
                  car_id: car-air-003
                  driver_id: u-driver-2
                  zone: airport
              no-license:
                summary: Посвідчення не підтверджено – кінцевий стан rejected
                value:
                  command_id: "r-{uuid}"
                  car_id: car-air-004
                  driver_id: nolicense-1
                  zone: airport
      responses:
        "202":
          description: Прийнято в чергу
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalStartState"
        "200":
          description: Повтор тієї самої команди – поточний стан
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalStartState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/rental-starts/{id}:
    get:
      tags:
        - rental-starts
      operationId: getRentalStart
      summary: Стан команди старту оренди
      x-course: request-state
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Стан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalStartState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/rental-start-effects:
    post:
      tags:
        - effects
      operationId: receiveRentalStartEffect
      summary: Приймач результату задачі Ray – одна транзакція (захист від повтору, ресурс, рішення)
      description: |
        Викликає задача Ray (виконавець), а не клієнт. Ключ ефекту – `command_id`. Перша доставка
        змінює `zone_cars`, пише рядок ефекту й рішення; повторна доставка того самого
        `command_id` повертає збережене рішення (`replayed: true`) без предметної зміни.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - command_id
                - license_ok
                - executor
              properties:
                command_id:
                  type: string
                license_ok:
                  type: boolean
                  description: результат перевірки посвідчення у виконавці
                executor:
                  type: string
                  description: вузол і pid процесу виконавця
            example:
              command_id: r-1
              license_ok: true
              executor: ray-worker@a1b2c3:412
      responses:
        "200":
          description: Рішення (нове або збережене)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decision"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/rental-start-effects/{id}:
    get:
      tags:
        - effects
      operationId: getRentalStartDecision
      summary: Рішення приймача, кількість доставок і підтвердження задачі
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Рішення
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Decision"
                  - type: object
                    properties:
                      executor:
                        type: string
                      effects:
                        type: integer
                        description: рядків ефекту для цієї команди (0 або 1)
                      acked_at:
                        type:
                          - string
                          - "null"
                        format: date-time
                      acked_by:
                        type:
                          - string
                          - "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/zone-cars/{id}:
    get:
      tags:
        - rental-starts
      operationId: getZoneCars
      summary: Ресурс зони. Інваріант – rented дорівнює кількості ефектів і не більший за cars_total
      x-course: resource-state
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: airport
      responses:
        "200":
          description: Стан ресурсу
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneCars"
              example:
                zone: airport
                cars_total: 10
                rented: 1
                effects: 1
                free: 9
                invariant_ok: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/compute:
    post:
      tags:
        - compute
      operationId: compute
      summary: Розрахунок ЛР2 – інтеграл n(t) = N(1 − e^(−t/τ)) на [a; b], машино-години
      description: |
        Синхронний: відповідь 200 – після об'єднання локальних сум усіх процесів. Проміжок вузлів
        ділиться на `parts` (типово = `workers`) суцільних відрізків без пропусків і перекриття;
        кожен процес пулу рахує локальну суму; батьківський процес додає їх у порядку номерів.
        Еталон – через первісну N(t + τe^(−t/τ)); `within_tolerance` – відносна похибка ≤ 1e-6.
        `mode`: local – локальні суми (робочий); lock – спільна змінна під блокуванням;
        none – спільна змінна без синхронізації (лише для досліду О2.4, втрачені оновлення).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComputeRequest"
            examples:
              normal:
                summary: Аеропорт, 6:00–18:00, 2·10^7 частин, 4 процеси
                value:
                  a: 0
                  b: 12
                  n: 20000000
                  workers: 4
              shared-none:
                summary: Дослід О2.4 – спільна сума без синхронізації
                value:
                  n: 400000
                  workers: 4
                  mode: none
      responses:
        "200":
          description: Результат
          headers:
            Location:
              description: /v1/compute/{id}
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComputeJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/compute/{id}:
    get:
      tags:
        - compute
      operationId: getCompute
      summary: Збережений результат розрахунку (останні 100, у пам'яті процесу api)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Результат
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComputeJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    apiToken:
      type: http
      scheme: bearer
  schemas:
    Decision:
      type: object
      required:
        - command_id
        - decision
        - deliveries
      properties:
        command_id:
          type: string
        decision:
          type: string
          enum:
            - done
            - rejected
        reason:
          type:
            - string
            - "null"
        deliveries:
          type: integer
          description: скільки разів ефект доставляли (повтори задачі)
        replayed:
          type: boolean
    Problem:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    RentalStartCreate:
      type: object
      additionalProperties: false
      required:
        - command_id
        - car_id
        - driver_id
        - zone
      properties:
        command_id:
          type: string
          description: "Ключ предметного ефекту; у спільному проєкті дорівнює rental_id частини Web. Символи: A-Z a-z 0-9 . _ : -"
          maxLength: 128
        car_id:
          type: string
        driver_id:
          type: string
        zone:
          type: string
    RentalStartState:
      type: object
      required:
        - id
        - command_id
        - zone
        - state
      properties:
        id:
          type: string
        command_id:
          type: string
        car_id:
          type: string
        driver_id:
          type: string
        zone:
          type: string
        state:
          type: string
          enum:
            - queued
            - processing
            - done
            - rejected
            - failed
        reason:
          type:
            - string
            - "null"
          description: "rejected: no free cars in zone | driver license not confirmed; failed: помилка обробки"
        arrived_at:
          type: string
          format: date-time
        started_at:
          type:
            - string
            - "null"
          format: date-time
        finished_at:
          type:
            - string
            - "null"
          format: date-time
    ZoneCars:
      type: object
      required:
        - zone
        - cars_total
        - rented
        - effects
        - invariant_ok
      properties:
        zone:
          type: string
        cars_total:
          type: integer
        rented:
          type: integer
        effects:
          type: integer
          description: Кількість записаних ефектів «старт оренди» зони
        free:
          type: integer
        invariant_ok:
          type: boolean
    ComputeRequest:
      type: object
      additionalProperties: false
      required:
        - n
      properties:
        a:
          type: number
          default: 0
          description: Початок, години від 6:00
        b:
          type: number
          default: 12
          description: Кінець, години від 6:00 (b > a)
        n:
          type: integer
          minimum: 1
          maximum: 400000000
          description: Кількість частин поділу проміжку (навантаження)
        workers:
          type: integer
          minimum: 1
          maximum: 8
          default: 1
          description: Кількість процесів
        parts:
          type: integer
          minimum: 1
          maximum: 4096
          description: Кількість відрізків вузлів; типово = workers
        method:
          type: string
          enum:
            - midpoint
            - trapezoid
            - simpson
          default: midpoint
          description: Середні прямокутники (основний), трапеції, Сімпсон (n парне)
        order:
          type: string
          enum:
            - forward
            - reverse
          default: forward
          description: Порядок обходу вузлів у частині
        summation:
          type: string
          enum:
            - naive
            - pairwise
            - kahan
          default: naive
          description: Послідовне, попарне чи компенсоване сумування
        mode:
          type: string
          enum:
            - local
            - lock
            - none
          default: local
          description: Спосіб об'єднання (О2.4)
        portion:
          type: integer
          minimum: 1
          default: 1
          description: Вузлів між додаваннями до спільної змінної (lock, none)
        cars:
          type: number
          default: 10
          description: N – парк зони, авто
        tau:
          type: number
          default: 1.5
          description: τ – стала розгону попиту, год
    ComputeJob:
      type: object
      required:
        - id
        - state
        - result
      properties:
        id:
          type: string
        state:
          type: string
          enum:
            - done
        active_parts:
          type: integer
        result:
          type: object
          properties:
            value:
              type: number
              description: Машино-години
            reference:
              type: number
            error:
              type: number
              description: value − reference
            rel_error:
              type: number
            tolerance:
              type: number
            within_tolerance:
              type: boolean
            wall_s:
              type: number
              description: Час від параметрів до результату, зокрема запуск пулу
            workers:
              type: integer
            parts:
              type: integer
            lost_value:
              type: number
              description: Лише lock/none – сума частин мінус спільна змінна (втрачені оновлення)
        parts:
          type: array
          items:
            type: object
        timing:
          type: object
          description: Розклад часу – запуск пулу, частини, зупинка, об'єднання
        params:
          $ref: "#/components/schemas/ComputeRequest"
      example:
        id: 4e0b1f0c-2d4e-4c55-8f3a-7f6b9a1c2d3e
        state: done
        active_parts: 0
        result:
          value: 105.0050319394166
          reference: 105.00503193941853
          error: -1.9e-12
          rel_error: 1.8e-14
          tolerance: 1.0e-6
          within_tolerance: true
          wall_s: 0.41
          workers: 4
          parts: 4

  responses:
    BadRequest:
      description: Пошкоджений JSON
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Потрібен токен API
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Не знайдено
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: command_id уже використано з іншими полями
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: Неправильні дані або невідома зона
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Черга повна, запит не прийнято
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
