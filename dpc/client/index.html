<!doctype html>
<!-- Клієнт платформи оренд C08 (DPC): команда старту оренди, очікування кінцевого стану, ресурс зони,
     розрахунок ЛР2 для 1, 2 і 4 процесів.
     Запуск з кореня репозиторію: python -m http.server 8083 --bind 127.0.0.1 --directory dpc/client -->
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Платформа оренд</title>
    <style>
        body {
            font: 15px/1.5 system-ui, sans-serif;
            max-width: 48rem;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        fieldset {
            margin-bottom: 1.5rem;
            border: 1px solid #ccc;
        }

        label {
            display: block;
            margin: .4rem 0;
        }

        input, select, textarea {
            font: inherit;
            width: 100%;
            box-sizing: border-box;
        }

        textarea {
            height: 8rem;
            font-family: ui-monospace, monospace;
        }

        button {
            font: inherit;
            margin: .5rem .5rem 0 0;
        }

        pre {
            background: #f3f3f3;
            padding: .75rem;
            white-space: pre-wrap;
        }

        .problem {
            color: #a00;
        }
    </style>
</head>
<body>
    <h1>Платформа оренд (DPC)</h1>

    <fieldset>
        <legend>Доступ</legend>
        <label>Токен API <input id="token"></label>
    </fieldset>

    <fieldset>
        <legend>Запит</legend>
        <form id="request-form">
            <label>Метод
                <select name="method">
                    <option>POST</option>
                    <option>GET</option>
                    <option>DELETE</option>
                </select>
            </label>
            <label>Шлях <input name="path" value="/v1/rental-starts"></label>
            <label>Тіло JSON (порожньо — без тіла)
                <textarea name="body">{"command_id": "r-demo-1", "car_id": "car-air-003", "driver_id": "u-driver-1", "zone": "airport"}</textarea>
            </label>
            <label><input type="checkbox" name="idempotent" style="width:auto" checked> з новим Idempotency-Key</label>
            <label><input type="checkbox" name="wait" style="width:auto" checked> чекати кінцевого стану за Location</label>
            <button>Надіслати</button>
        </form>
    </fieldset>

    <fieldset>
        <legend>Розрахунок ЛР2: машино-години n(t) = N(1 − e^(−t/τ)) на [a; b]</legend>
        <form id="compute-form">
            <label>a, год від 6:00 <input name="a" type="number" step="any" value="0"></label>
            <label>b, год від 6:00 <input name="b" type="number" step="any" value="12"></label>
            <label>n – кількість частин <input name="n" type="number" value="20000000"></label>
            <label>Метод <select name="method"><option>midpoint</option><option>trapezoid</option><option>simpson</option></select></label>
            <label>Сумування <select name="summation"><option>naive</option><option>pairwise</option><option>kahan</option></select></label>
            <label>Спільна сума <select name="mode"><option>local</option><option>lock</option><option>none</option></select></label>
            <button>Порахувати для 1, 2 і 4 процесів</button>
        </form>
        <table id="compute-table"></table>
    </fieldset>

    <fieldset>
        <legend>Читання</legend>
        <button data-path="/v1/zone-cars/airport">Зона «аеропорт»</button>
        <button data-path="/v1/zone-cars/loadtest">Зона loadtest</button>
        <button data-path="/metrics">Метрики</button>
    </fieldset>

    <h2>Відповідь</h2>
    <pre id="out">—</pre>

    <script type="module">
        import {call, getToken, newKey, Problem, setToken, waitFinal} from "./api.js";

        const out = document.getElementById("out");

        const show = (value, isProblem = false) => {
            out.className = isProblem ? "problem" : "";
            out.textContent = typeof value === "string" ? value : JSON.stringify(value, null, 2);
        };

        const report = (error) =>
            error instanceof Problem
                ? show({status: error.status, ...error.body}, true)
                : show(String(error), true);

        const token = document.getElementById("token");
        token.value = getToken();
        token.onchange = () => setToken(token.value);

        document.getElementById("request-form").onsubmit = async (event) => {
            event.preventDefault();
            const form = new FormData(event.target);
            const text = form.get("body").trim();
            try {
                const reply = await call(form.get("method"), form.get("path"), {
                    body: text ? JSON.parse(text) : undefined,
                    idempotencyKey: form.get("idempotent") ? newKey() : undefined,
                });
                const location = reply.headers.get("location");
                show({status: reply.status, location, body: reply.data});

                if (form.get("wait") && location) {
                    const final = await waitFinal(location, {
                        onStep: (data) => show({waiting: location, body: data}),
                    });
                    show({final: location, body: final});
                }
            } catch (error) {
                report(error);
            }
        };

        document.getElementById("compute-form").onsubmit = async (event) => {
            event.preventDefault();
            const f = Object.fromEntries(new FormData(event.target));
            const table = document.getElementById("compute-table");
            const rows = ["<tr><th>p</th><th>значення</th><th>еталон</th><th>відн. похибка</th><th>у допуску</th><th>час, с</th><th>S_p</th></tr>"];
            let t1 = null;
            try {
                for (const workers of [1, 2, 4]) {
                    table.innerHTML = rows.join("") + `<tr><td colspan="7">рахується p = ${workers}…</td></tr>`;
                    const body = {a: +f.a, b: +f.b, n: +f.n, workers, method: f.method, summation: f.summation, mode: f.mode};
                    const r = (await call("POST", "/v1/compute", {body})).data.result;
                    t1 ??= r.wall_s;
                    rows.push(`<tr><td>${workers}</td><td>${r.value.toFixed(9)}</td><td>${r.reference.toFixed(9)}</td>
                        <td>${r.rel_error.toExponential(2)}</td><td>${r.within_tolerance ? "так" : "НІ"}</td>
                        <td>${r.wall_s.toFixed(3)}</td><td>${(t1 / r.wall_s).toFixed(2)}</td></tr>`);
                    show(r);
                }
                table.innerHTML = rows.join("");
            } catch (error) {
                report(error);
            }
        };

        for (const button of document.querySelectorAll("button[data-path]")) {
            button.onclick = async () => {
                try {
                    show((await call("GET", button.dataset.path)).data);
                } catch (error) {
                    report(error);
                }
            };
        }
    </script>
</body>
</html>
