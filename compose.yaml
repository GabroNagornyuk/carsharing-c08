# C08 Каршеринг – спільний запуск частин Web і DPC. З кореня репозиторію:
#   docker compose up -d --build
# Сервіси додаються лабораторна за лабораторною; зараз – ЛР1 обох курсів.

x-web-server: &web-server
  build: ./web/server
  image: carsharing-web:${APP_TAG:-dev}
  environment: &web-env
    DATABASE_URL: postgresql://app:app@postgres:5432/app
    CLIENT_ORIGIN: "${WEB_CLIENT_ORIGIN:-http://localhost:8081,http://127.0.0.1:8081}"
    POOL_SIZE: ${POOL_SIZE:-10}
    HOLD_MINUTES: ${HOLD_MINUTES:-15}
    FAULTS: "on"
  depends_on:
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped
  stop_grace_period: 30s
  volumes:
    - faults:/faults

services:
  # ---------------------------------------------------------------- спільне
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    command: ["postgres", "-c", "max_connections=${PG_MAX_CONNECTIONS:-100}"]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      retries: 30

  migrate:
    image: postgres:17.11
    command: ["sh", "-c", "sh /migrate/migrate.sh $${MIGRATE_TO:+--to $$MIGRATE_TO}"]
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      MIGRATIONS_DIR: /migrations
      MIGRATE_TO: ${MIGRATE_TO:-}
    volumes:
      - ./web/configs/migrate:/migrate:ro
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------- Web
  app-a:
    <<: *web-server
    environment:
      <<: *web-env
      INSTANCE: app-a
    ports:
      - "${APP_A_PORT:-8001}:8000"
  app-b:
    <<: *web-server
    environment:
      <<: *web-env
      INSTANCE: app-b
    ports:
      - "${APP_B_PORT:-8002}:8000"
  nginx:
    image: nginx:1.31.7
    volumes:
      - ./web/configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      - app-a
      - app-b
    restart: unless-stopped

  # ---------------------------------------------------------------- DPC
  api:
    build: ./dpc/api
    image: carsharing-dpc-api:${APP_TAG:-dev}
    environment:
      INSTANCE: api
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      API_TOKEN: ${API_TOKEN:-dev-token}
      CLIENT_ORIGIN: "${DPC_CLIENT_ORIGIN:-http://localhost:8083,http://127.0.0.1:8083}"
      QUEUE_CAPACITY: ${QUEUE_CAPACITY:-50}
      WORKERS: ${WORKERS:-4}
      RESOURCE_MODE: ${RESOURCE_MODE:-locked}
      LICENSE_CHECK_MS: ${LICENSE_CHECK_MS:-300-900}
      FAULTS: "on"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - faults:/faults
    stop_grace_period: 120s
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  faults:
