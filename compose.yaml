# C08 Каршеринг – спільний запуск частин Web і DPC. З кореня репозиторію:
#   docker compose up -d --build
# Сервіси додаються лабораторна за лабораторною; зараз – ЛР1–ЛР3 обох курсів.

x-web-server: &web-server
  build: ./web/server
  image: carsharing-web:${APP_TAG:-dev}
  environment: &web-env
    DATABASE_URL: postgresql://app:app@postgres:5432/app
    CLIENT_ORIGIN: "${WEB_CLIENT_ORIGIN:-http://localhost:8081,http://127.0.0.1:8081}"
    POOL_SIZE: ${POOL_SIZE:-10}
    HOLD_MINUTES: ${HOLD_MINUTES:-15}
    IDEMPOTENCY_TTL_H: ${IDEMPOTENCY_TTL_H:-24}
    IDEMPOTENCY_CLEANUP_S: ${IDEMPOTENCY_CLEANUP_S:-60}
    SESSION_TTL_MIN: ${SESSION_TTL_MIN:-60}
    LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
    LOGIN_WINDOW_MIN: ${LOGIN_WINDOW_MIN:-15}
    FAULTS: "on"
  depends_on:
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped
  stop_grace_period: 30s
  volumes:
    - faults:/faults

services:
  # ---------------------------------------------------------------- спільне
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    command: ["postgres", "-c", "max_connections=${PG_MAX_CONNECTIONS:-100}"]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      retries: 30

  migrate:
    image: postgres:17.11
    command: ["sh", "-c", "sh /migrate/migrate.sh $${MIGRATE_TO:+--to $$MIGRATE_TO}"]
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      MIGRATIONS_DIR: /migrations
      MIGRATE_TO: ${MIGRATE_TO:-}
    volumes:
      - ./web/configs/migrate:/migrate:ro
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------- Web
  app-a:
    <<: *web-server
    environment:
      <<: *web-env
      INSTANCE: app-a
    ports:
      - "${APP_A_PORT:-8001}:8000"
  app-b:
    <<: *web-server
    environment:
      <<: *web-env
      INSTANCE: app-b
    ports:
      - "${APP_B_PORT:-8002}:8000"
  nginx:
    image: nginx:1.31.7
    volumes:
      - ./web/configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      - app-a
      - app-b
    restart: unless-stopped

  # ---------------------------------------------------------------- DPC
  # Один образ для api, ray-head і ray-worker: версії Python і Ray у клієнті й на вузлах однакові,
  # а вузли імпортують код задач (app/ray_tasks.py).
  api:
    build: ./dpc/api
    image: carsharing-dpc-api:${APP_TAG:-dev}
    environment: &dpc-env
      INSTANCE: api
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      API_TOKEN: ${API_TOKEN:-dev-token}
      CLIENT_ORIGIN: "${DPC_CLIENT_ORIGIN:-http://localhost:8083,http://127.0.0.1:8083}"
      QUEUE_CAPACITY: ${QUEUE_CAPACITY:-50}
      WORKERS: ${WORKERS:-4}
      RESOURCE_MODE: ${RESOURCE_MODE:-locked}
      LICENSE_CHECK_MS: ${LICENSE_CHECK_MS:-300-900}
      COMPUTE_POOL: ${COMPUTE_POOL:-fresh}
      COMPUTE_TOLERANCE: ${COMPUTE_TOLERANCE:-1e-6}
      # ЛР3: обробка команд старту в задачах Ray; local – пул обробників ЛР1 у процесі api
      EXECUTION: ${EXECUTION:-ray}
      RAY_ADDRESS: ray://ray-head:10001
      RECEIVER_URL: http://api:8000
      IN_FLIGHT_LIMIT: ${IN_FLIGHT_LIMIT:-8}
      RAY_MAX_RETRIES: ${RAY_MAX_RETRIES:-3}
      FAULTS: "on"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - faults:/faults
    stop_grace_period: 120s
    depends_on:
      migrate:
        condition: service_completed_successfully
      ray-head:
        condition: service_started
    restart: unless-stopped

  ray-head:
    build: ./dpc/api   # той самий образ, що й api (збирання з кешу)
    image: carsharing-dpc-api:${APP_TAG:-dev}
    command: ["ray", "start", "--head", "--port=6379", "--ray-client-server-port=10001",
              "--dashboard-host=0.0.0.0", "--num-cpus=1", "--disable-usage-stats", "--block"]
    environment:
      <<: *dpc-env
      INSTANCE: ray-head
    ports:
      - "${RAY_DASHBOARD_PORT:-8265}:8265"
    volumes:
      - faults:/faults   # керована відмова after_effect_before_ack спрацьовує у виконавці
    shm_size: 1g
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  ray-worker:
    build: ./dpc/api
    image: carsharing-dpc-api:${APP_TAG:-dev}
    command: ["ray", "start", "--address=ray-head:6379", "--num-cpus=2", "--disable-usage-stats", "--block"]
    environment:
      <<: *dpc-env
      INSTANCE: ray-worker
    volumes:
      - faults:/faults
    shm_size: 1g
    depends_on:
      - ray-head
    restart: unless-stopped

volumes:
  pgdata:
  faults:
