# Host :8080 -> nginx :80 -> app-a, app-b (least_conn). Upstreams listen on 8000 inside containers.
# ЛР1: лише два екземпляри сервера. Шлюзи WebSocket (ЛР5) і canary (ЛР6) додаються в тих ЛР.
events { worker_connections 4096; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format json escape=json '{"time":"$time_iso8601","request_id":"$req_id","upstream":"$upstream_addr",'
                              '"method":"$request_method","uri":"$uri","status":$status,"rt":$request_time}';
  access_log /dev/stdout json;

  upstream app {
    least_conn;
    server app-a:8000 max_fails=1 fail_timeout=2s;
    server app-b:8000 max_fails=1 fail_timeout=2s;
  }

  map $http_x_request_id $req_id { default $http_x_request_id; "" $request_id; }

  server {
    listen 80;

    location / {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Request-ID $req_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # nginx never repeats a POST/PATCH/DELETE that was already sent
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
      proxy_connect_timeout 1s;
      proxy_read_timeout 30s;
    }
  }
}
