# Контракт частини Web, C08 «Каршеринг». Маршрути додаються з кожною ЛР; зараз – ЛР1 і ЛР2.
# x-course позначає роль маршруту для засобу check: main, object, update, cancel.
# Приклади запитів посилаються на демодані migrations/900_seed.sql.
openapi: 3.1.0
info:
  title: Каршеринг – Web API
  version: 1.0.0
  description: |
    Водій бронює автомобіль на 15 хвилин (held), далі – розблокування, поїздка й завершення.
    Помилки – Problem Details (RFC 9457, `application/problem+json`). Ідентифікатори – рядки.
    Гроші – ціле число копійок і валюта. Час – RFC 3339 із зоною.
    До ЛР3 користувача визначає заголовок `X-User-Id` (заздалегідь створений користувач).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8080
security:
  - userId: []

tags:
  - name: service
    description: Службові маршрути
  - name: cars
    description: Автомобілі
  - name: rentals
    description: Оренди (бронювання авто)

paths:
  /health:
    get:
      tags:
        - service
      operationId: getHealth
      summary: Перевірка живучості процесу, без звернення до бази
      security: []
      responses:
        "200":
          description: Процес відповідає
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  instance:
                    type: string
              example:
                status: ok
                instance: app-a

  /v1/cars:
    get:
      tags:
        - cars
      operationId: listFreeCars
      summary: Вільні автомобілі зони (не на обслуговуванні й без незавершеної оренди)
      parameters:
        - name: zone
          in: query
          required: true
          schema:
            type: string
          example: airport
      responses:
        "200":
          description: Вільні автомобілі
          content:
            application/json:
              schema:
                type: object
                required:
                  - zone
                  - items
                properties:
                  zone:
                    type: string
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Car"
              example:
                zone: airport
                items:
                  - id: car-air-002
                    zone: airport
                    plate: AA0102KB
                    class: business
                    charge_pct: 54
                    status: available
                    tariff:
                      per_minute_minor: 990
                      per_km_minor: 600
                      currency: UAH
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /v1/rentals:
    post:
      tags:
        - rentals
      operationId: createRental
      summary: Забронювати автомобіль на 15 хвилин (головна операція)
      description: |
        В одній транзакції: блокування рядка авто, перевірка «не на обслуговуванні» і «немає
        іншої незавершеної оренди», запис оренди в стані held, запис ключа ідемпотентності з
        відповіддю. 201 надсилається після фіксації.

        `Idempotency-Key` обов'язковий (немає – 400). Повтор з тим самим ключем і тим самим тілом
        повертає збережену відповідь (той самий код, тіло й Location, `Idempotent-Replayed: true`),
        зокрема й збережену предметну відмову 404/409; з іншим тілом – 422; ключ ще обробляється
        іншою транзакцією – 409 `idempotency-key-in-progress` з `Retry-After`. Ключ діє 24 год.
      x-course: main
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RentalCreate"
            examples:
              normal:
                summary: Вільний автомобіль
                value:
                  car_id: car-cen-001
              scarce:
                summary: Один автомобіль – для досліду гонки (успіх лише один)
                value:
                  car_id: car-air-010
                x-capacity: 1
              missing:
                summary: Такого автомобіля немає – 404
                value:
                  car_id: no-such-car
              in-service:
                summary: Автомобіль на обслуговуванні – 409
                value:
                  car_id: car-pod-004
      responses:
        "201":
          description: Бронювання створено (або збережена відповідь на повтор з тим самим ключем)
          headers:
            Location:
              description: Адреса створеної оренди
              schema:
                type: string
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rental"
              example:
                id: 690eb3a7-cea6-4658-9fe3-6a7c8cbc7e71
                car_id: car-cen-001
                status: held
                version: 1
                created_at: "2026-11-13T15:54:15.731370+00:00"
                expires_at: "2026-11-13T16:09:15.731370+00:00"
                started_at: null
                finished_at: null
                km: null
                amount: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /v1/rentals/{id}:
    get:
      tags:
        - rentals
      operationId: getRental
      summary: Одна оренда поточного користувача (чужа – 404)
      x-course: object
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Оренда
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rental"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - rentals
      operationId: extendRental
      summary: Продовжити бронювання (If-Match з ETag)
      description: |
        Лише чинне бронювання (held, строк не минув). Перевірка версії й запис – одна інструкція
        `UPDATE … WHERE version = :if_match`. Без If-Match – 428, застаріла версія – 412.
        Змінити можна лише строк: власник, стан і версія – не поля запиту (422).
      x-course: update
      parameters:
        - $ref: "#/components/parameters/RentalId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RentalExtend"
            examples:
              normal:
                summary: Продовжити на 10 хвилин
                value:
                  extend_minutes: 10
              forbidden:
                summary: Спроба змінити стан – 422
                value:
                  status: active
      responses:
        "200":
          description: Строк продовжено, версія +1
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rental"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /v1/rentals/{id}/cancel:
    post:
      tags:
        - rentals
      operationId: cancelRental
      summary: Скасувати бронювання; повтор повертає вже зафіксований стан
      description: |
        held → cancelled умовним записом `UPDATE … WHERE status = 'held'`. Повторне скасування
        повертає той самий cancelled (`X-Already-Cancelled: true`) без жодної зміни: авто не
        звільняється вдруге й нова оренда цього авто іншим водієм не зачіпається.
      x-course: cancel
      parameters:
        - $ref: "#/components/parameters/RentalId"
      responses:
        "200":
          description: Оренда скасована (зараз або раніше)
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Already-Cancelled:
              description: true – скасовано раніше, цей запит нічого не змінив
              schema:
                type: string
                enum:
                  - "true"
                  - "false"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rental"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  securitySchemes:
    userId:
      type: apiKey
      in: header
      name: X-User-Id
      description: "До ЛР3: ідентифікатор користувача з демоданих (u-driver-1, u-driver-2, u-operator)"

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Ключ ідемпотентності; той самий у всіх повторах однієї операції
      schema:
        type: string
        minLength: 8
        maxLength: 128
      example: k-6f1c2a9e-4b7d-4c1e-9a55-2d3f8b0e7c11
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: ETag оренди з GET; без заголовка – 428
      schema:
        type: string
      example: '"1"'
    RentalId:
      name: id
      in: path
      required: true
      schema:
        type: string

  headers:
    ETag:
      description: Версія оренди
      schema:
        type: string
      example: '"2"'
    IdempotentReplayed:
      description: true – це збережена відповідь на повтор з тим самим ключем
      schema:
        type: string
        enum:
          - "true"
          - "false"
    RetryAfter:
      description: Через скільки секунд повторити
      schema:
        type: integer

  schemas:
    Problem:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    Money:
      type: object
      required:
        - amount_minor
        - currency
      properties:
        amount_minor:
          type: integer
          description: Сума в копійках
        currency:
          type: string
          examples:
            - UAH
    Car:
      type: object
      required:
        - id
        - zone
        - class
        - charge_pct
        - status
        - tariff
      properties:
        id:
          type: string
        zone:
          type: string
        plate:
          type: string
        class:
          type: string
          enum:
            - economy
            - comfort
            - business
        charge_pct:
          type: integer
          minimum: 0
          maximum: 100
        status:
          type: string
          enum:
            - available
            - service
        tariff:
          type: object
          required:
            - per_minute_minor
            - per_km_minor
            - currency
          properties:
            per_minute_minor:
              type: integer
              description: Копійки за хвилину
            per_km_minor:
              type: integer
              description: Копійки за кілометр
            currency:
              type: string
    RentalCreate:
      type: object
      additionalProperties: false
      required:
        - car_id
      properties:
        car_id:
          type: string
          minLength: 1
          maxLength: 64
    RentalExtend:
      type: object
      additionalProperties: false
      required:
        - extend_minutes
      properties:
        extend_minutes:
          type: integer
          minimum: 1
          maximum: 15
    Rental:
      type: object
      required:
        - id
        - car_id
        - status
        - version
        - created_at
        - expires_at
      properties:
        id:
          type: string
          description: rental_id – спільний із DPC (command_id старту оренди)
        car_id:
          type: string
        status:
          type: string
          enum:
            - held
            - active
            - finished
            - expired
            - cancelled
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Кінець бронювання; почати оренду можна лише до цього моменту
        started_at:
          type:
            - string
            - "null"
          format: date-time
        finished_at:
          type:
            - string
            - "null"
          format: date-time
        km:
          type:
            - integer
            - "null"
        amount:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"

  responses:
    BadRequest:
      description: Пошкоджений JSON або немає чи неправильний Idempotency-Key
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://example.edu/problems/malformed-json
            title: Request body is not valid JSON
            status: 400
            instance: /v1/rentals
    Unauthorized:
      description: Немає або невідомий X-User-Id
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://example.edu/problems/unauthenticated
            title: X-User-Id header required
            status: 401
            instance: /v1/rentals
    NotFound:
      description: Ресурсу немає (або чужа оренда)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://example.edu/problems/car-not-found
            title: Car not found
            status: 404
            detail: car 'no-such-car' does not exist
            instance: /v1/rentals
    Conflict:
      description: |
        Автомобіль уже в незавершеній оренді (car-busy) або на обслуговуванні (car-in-service);
        запит з цим Idempotency-Key ще обробляється (idempotency-key-in-progress, з Retry-After);
        оренду не можна продовжити чи скасувати в поточному стані
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://example.edu/problems/car-busy
            title: Car is already rented
            status: 409
            detail: the car is in another active rental
            instance: /v1/rentals
    PreconditionFailed:
      description: If-Match не збігається з поточною версією
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://example.edu/problems/precondition-failed
            title: Rental was changed
            status: 412
            instance: /v1/rentals/690eb3a7-cea6-4658-9fe3-6a7c8cbc7e71
    PreconditionRequired:
      description: Немає If-Match
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://example.edu/problems/precondition-required
            title: If-Match header required
            status: 428
            instance: /v1/rentals/690eb3a7-cea6-4658-9fe3-6a7c8cbc7e71
    Unprocessable:
      description: Неправильні дані або Idempotency-Key уже використано з іншим тілом (idempotency-key-reused)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://example.edu/problems/invalid-request
            title: Invalid request data
            status: 422
            instance: /v1/rentals
            errors:
              - field: body.car_id
                message: Field required
